name: Build MathSolver Full APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q MathSolver_GitHub_APK_FULL.zip -d build_project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build_project
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp build_project/app/build/outputs/apk/debug/app-debug.apk MathSolver-Full.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathSolver-Full-APK
          path: MathSolver-Full.apk
